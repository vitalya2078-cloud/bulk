plugins { id 'com.android.application' }

android {
    namespace 'ru.bulk.admin'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.bulk.admin'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    // Ключ подписи лежит в репозитории: один и тот же ключ нужен, чтобы новая версия
    // ставилась поверх старой. Приложение без кода из игры ничего не открывает.
    signingConfigs {
        release {
            storeFile file('../admin.jks')
            storePassword 'bulkadmin'
            keyAlias 'bulk'
            keyPassword 'bulkadmin'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
