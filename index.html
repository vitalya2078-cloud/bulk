    <canvas id="boot-cv" class="boot-cv"></canvas>

      </div>
      <small id="boot-status" class="boot-text">Разогреваем котёл…</small>
      <button id="boot-start" class="btn boot-start" type="button" hidden>Нажми, чтобы начать</button>
      <small id="boot-hint" class="boot-hint">Коснись экрана, чтобы включить звук</small>
    </div>
  </div>
  <div id="app">

      <div class="avatar-wrap"><button id="btn-profile" class="avatar-btn" type="button" aria-label="Профиль"><img id="avatar-img" class="pic" src="assets/images/avatars/a01.webp?v=0.28.2" alt="" draggable="false" referrerpolicy="no-referrer"><img class="avatar-frame" src="assets/images/hud/avatar_frame.webp?v=0.28.2" alt="" draggable="false"></button><button id="lvl-chip" class="lvl-chip" type="button" aria-label="Уровень алхимика и навыки">1</button></div>
      <button id="rank-btn" class="rank" type="button" aria-label="Ранг лавки">
        <span class="rank-ico" aria-hidden="true"><img id="rank-icon" class="pic" src="assets/images/ranks/1.webp?v=0.28.2" alt="" draggable="false"></span>
        <span class="rank-text">
          <b id="rank-name">Лоток травницы</b>
          <i class="rank-bar"><i id="rank-fill"></i></i>
        </span>
      </button>
      <button id="crystal-pill" class="crystal-pill" type="button" aria-label="Лунные кристаллы"><img class="pic" src="assets/images/ui/crystal.webp?v=0.28.2" alt="" draggable="false"><b id="crystals">0</b></button>
      <button id="btn-settings" class="round" type="button" aria-label="Настройки"><img class="pic" src="assets/images/ui/gear.webp?v=0.28.2" alt="" draggable="false"></button>
    </header>

    <div class="wallet">

    <main class="screens">

          <button id="mail-btn" class="brew-btn mail-btn" type="button" aria-label="Почта" hidden><img class="pic" src="assets/images/ui/envelope.webp?v=0.28.2" alt="" draggable="false"><span>Почта</span><b hidden></b></button>
          <button id="wheel-btn" class="brew-btn wheel-btn" type="button" aria-label="Колесо Булька" hidden><img class="pic" src="assets/images/ui/wheel.webp?v=0.28.2" alt="" draggable="false"><span>Колесо</span><b hidden></b></button>
          <button id="relic-btn" class="brew-btn relic-btn" type="button" aria-label="Диковинки и сундуки" hidden><img class="pic" src="assets/images/relics/chest_g.webp?v=0.28.2" alt="" draggable="false"><span>Диковинки</span><b hidden></b></button>

          <button id="ward-btn" class="brew-btn ward-btn" type="button" aria-label="Гардероб Булька"><img class="pic" src="assets/images/ui/wardrobe.webp?v=0.28.2" alt="" draggable="false"><span>Гардероб</span></button>
          </div>
          <button id="goal" class="goal" type="button" hidden></button>
          <div id="visitor" class="visitor" aria-live="polite"></div>
          <div id="guard" class="guard" hidden></div>
        </div>
        <div class="daily-row">
          <button id="btn-gift" class="daily" type="button"><img class="d-ico" src="assets/images/ui/gift.webp?v=0.28.2" alt="" draggable="false"><span><b>Подарок</b><small id="sub-gift"></small></span><span id="dot-gift" class="dot" hidden></span></button>
          <button id="btn-recipe" class="daily" type="button"><img class="d-ico" src="assets/images/ui/book.webp?v=0.28.2" alt="" draggable="false"><span><b>Рецепт дня</b><small id="sub-recipe"></small></span><span id="dot-recipe" class="dot" hidden></span></button>
          <button id="btn-rune" class="daily" type="button"><img class="d-ico" src="assets/images/ui/rune.webp?v=0.28.2" alt="" draggable="false"><span><b>Руна дня</b><small id="sub-rune"></small></span><span id="dot-rune" class="dot" hidden></span></button>
        </div>
      </section>

      <section class="screen" data-screen="shop">
        <div class="shop-wrap">
          <div class="stats shop-stats">
            <div class="stat"><small>За тап</small><b id="st-tap">+1</b></div>
            <div class="stat"><small>В час</small><b id="st-hour">+0</b></div>
            <div class="stat"><small>Копится</small><b id="st-cap">3 ч</b></div>
          </div>
          <div id="shop-body" class="scroll"></div>
        </div>
      </section>
      <section class="screen" data-screen="wardrobe"><div id="wardrobe-body" class="scroll"></div></section>
      <section class="screen" data-screen="tasks"><div id="tasks-body" class="scroll"></div></section>
      <section class="screen" data-screen="friends"><div id="friends-body" class="scroll"></div></section>
      <section class="screen" data-screen="profile"><div id="profile-body" class="scroll"></div></section>
    </main>

    <nav id="tabs" class="tabs" role="tablist"></nav>

    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Скрипты платформ грузятся только там, где они нужны:
       Telegram передаёт tgWebAppData в адресе, ВКонтакте - vk_app_id. -->
  <script>
    (function () {
      var url = location.search + location.hash;
      if (url.indexOf('tgWebAppData') >= 0) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      if (url.indexOf('vk_app_id') >= 0) {
        // 1) Сразу говорим ВК «игра запускается» - иначе заставка ВК висит, пока не загрузится модуль.
        try {
          var A = window.AndroidBridge, I = window.webkit && window.webkit.messageHandlers;
          if (A && A.VKWebAppInit) A.VKWebAppInit('{}');
          else if (I && I.VKWebAppInit) I.VKWebAppInit.postMessage({});
          else if (window.parent !== window) window.parent.postMessage({ handler: 'VKWebAppInit', params: {}, type: 'vk-connect' }, '*');
        } catch (e) {}
        // 2) Модуль ВК грузим в фоне, не задерживая игру; не ответил первый сайт - пробуем второй.
        window.__vkBridge = new Promise(function (done) {
          var urls = ['https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js', 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2/dist/browser.min.js'];
          (function next(i) {
            if (window.vkBridge || i >= urls.length) { done(window.vkBridge || null); return; }
            var s = document.createElement('script'); s.async = true; s.src = urls[i];
            var t = setTimeout(function () { s.onload = s.onerror = null; next(i + 1); }, 3000);
            s.onload = function () { clearTimeout(t); done(window.vkBridge || null); };
            s.onerror = function () { clearTimeout(t); next(i + 1); };
            document.head.appendChild(s);
          })(0);
        });
      }
    })();
  </script>
