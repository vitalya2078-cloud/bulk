<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08090C">
<title>Бульк · Админ</title>
<link rel="icon" href="../assets/icon.png">
<script>
  // Telegram-скрипт не нужен в приложении «Бульк Админ» и во ВКонтакте (там его не ждём)
  if (!window.BulkApp && !/[?&]vk_user_id=/.test(location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
</script>
<script>
  // номер версии в адресе, чтобы ВК и Telegram не показывали старую копию админки (в приложении файлы локальные - без него)
  var ADM_BUILD = '1c5aa4f131';
  window.__admV = /^https?:/.test(location.protocol) ? '?v=' + ADM_BUILD : '';
  document.write('<link rel="stylesheet" href="admin.css' + window.__admV + '">');
</script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>document.write('<script src="admin.js' + window.__admV + '"><\/script>');</script>
</body>
</html>
