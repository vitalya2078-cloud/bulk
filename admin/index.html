<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Бульк · Админка</title>
<link rel="icon" href="../assets/icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face { font-family: "Nunito"; src: url("../assets/fonts/nunito.woff") format("woff"); font-weight: 200 1000; font-display: swap; }
:root {
  --bg: #1B1030; --bg2: #24163A; --card: #2E1E4D; --card2: #3A2862; --line: #4B357C; --ink: #12091F;
  --gold: #FFC94D; --gold2: #FFE48A; --mint: #5BE0B3; --rose: #FF7A9A; --sky: #7CC4FF; --orange: #FFA552;
  --text: #FFF6E8; --muted: #B9A6DC; --dim: #8A78AE;
  --safe-top: 0px; --safe-bottom: 0px; --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body {
  color: var(--text); font: 15px/1.4 "Nunito", system-ui, sans-serif; font-weight: 600;
  background: radial-gradient(120% 60% at 50% -10%, #3B2468 0%, var(--bg) 60%) fixed;
  overscroll-behavior: none;
}
*, *::before { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; }

/* шапка */
.top { position: sticky; top: 0; z-index: 20; padding: calc(var(--safe-top) + 10px) 14px 10px; background: linear-gradient(var(--bg) 70%, rgba(27,16,48,0)); }
.top-in { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
.logo { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--gold); background: var(--card) center/cover; flex: 0 0 42px; }
.top h1 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.1; }
.top h1 small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.top .grow { flex: 1; min-width: 0; }
.ibtn { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 18px; }
.ibtn:active, .btn:active, .chip:active, .row:active, .nav button:active { transform: scale(.96); }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { max-width: 760px; margin: 0 auto; padding: 4px 14px calc(var(--safe-bottom) + 96px); }
.h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 2px 10px; font-size: 13px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.h2:first-child { margin-top: 6px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; }
.card + .card { margin-top: 10px; }
.muted { color: var(--muted); }
.dim { color: var(--dim); font-size: 13px; }
.center { text-align: center; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { position: relative; padding: 10px 10px 9px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.kpi b { display: block; font-size: 22px; font-weight: 900; line-height: 1.1; }
.kpi span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.2; margin-top: 2px; }
.kpi.hot { border-color: var(--gold); background: linear-gradient(160deg, #4A2E7A, var(--card)); }
.kpi.hot b { color: var(--gold2); }
.kpi .live { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(91,224,179,.7); animation: pulse 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(91,224,179,0); } 100% { box-shadow: 0 0 0 0 rgba(91,224,179,0); } }

/* график */
.chart svg { width: 100%; height: 170px; overflow: visible; }
.legend { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
.bar .track { grid-column: 1 / -1; height: 9px; border-radius: 6px; background: var(--ink); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--orange)); }
.bar b { color: var(--gold2); }

/* поиск, фильтры */
.search { position: relative; }
.search input { width: 100%; height: 46px; padding: 0 14px 0 42px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); outline: none; font-weight: 700; }
.search input:focus { border-color: var(--gold); }
.search::before { content: "🔍"; position: absolute; left: 14px; top: 12px; font-size: 16px; opacity: .8; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 10px -14px 0; padding: 0 14px 2px; }
.chip { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--muted); font-size: 13.5px; font-weight: 800; white-space: nowrap; }
.chip.on { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.sortline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 2px 8px; font-size: 13px; color: var(--muted); }
select { height: 34px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-size: 13px; font-weight: 800; outline: none; }

/* строки игроков */
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); text-align: left; }
.row.ban { border-color: #7A2F4A; background: #33163A; }
.ava { position: relative; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card2) center/cover; }
.ava.big { width: 78px; height: 78px; flex-basis: 78px; border: 3px solid var(--gold); }
.ava .on { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: var(--mint); border: 2px solid var(--card); }
.who { flex: 1; min-width: 0; }
.who b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 900; }
.who small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
.nums { text-align: right; flex: 0 0 auto; }
.nums b { display: block; color: var(--gold2); font-size: 14px; font-weight: 900; }
.nums small { color: var(--dim); font-size: 11.5px; }
.tags { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 10.5px; font-weight: 900; background: var(--card2); color: var(--muted); }
.tag.red { background: #5A1E36; color: #FFB3C4; }
.tag.gold { background: #5A4416; color: var(--gold2); }
.tag.mint { background: #134A3B; color: var(--mint); }
.more { width: 100%; margin-top: 10px; }

/* кнопки, поля */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--ink); background: linear-gradient(#FFD86A, #F2A93A); color: #3A1E05; font-weight: 900; box-shadow: 0 3px 0 var(--ink); }
.btn.alt { background: var(--card2); color: var(--text); border-color: var(--line); box-shadow: none; }
.btn.red { background: linear-gradient(#FF8FA6, #E2506F); color: #3A0414; }
.btn.mint { background: linear-gradient(#8BF0CC, #3EC496); color: #06321F; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
.btn[disabled] { opacity: .45; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns.three { grid-template-columns: repeat(3, 1fr); }
.field { display: block; margin-bottom: 10px; }
.field > span { display: block; margin: 0 2px 5px; font-size: 12.5px; color: var(--muted); font-weight: 800; }
.input, textarea.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--ink); outline: none; font-weight: 700; resize: vertical; }
.input:focus { border-color: var(--gold); }
.inline { display: flex; gap: 8px; align-items: stretch; }
.inline .input { flex: 1; min-width: 0; }
.seg { display: flex; padding: 3px; border-radius: 13px; background: var(--ink); gap: 3px; }
.seg button { flex: 1; min-height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 900; font-size: 13.5px; }
.seg button.on { background: var(--card2); color: var(--gold2); }

/* переключатели */
.tog { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
.tog:first-child { border-top: 0; }
.tog .t { flex: 1; }
.tog .t b { display: block; font-weight: 900; }
.tog .t small { color: var(--muted); font-size: 12.5px; }
.sw { position: relative; flex: 0 0 52px; width: 52px; height: 30px; border-radius: 99px; border: 2px solid var(--ink); background: #4A3A66; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #FFF6E8; transition: transform .2s; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.sw.on { background: var(--mint); }
.sw.on.danger { background: var(--rose); }
.sw.on::after { transform: translateX(22px); }

/* карточка игрока */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet main { padding-top: 0; }
.hero { display: flex; gap: 14px; align-items: center; padding: 6px 2px 4px; }
.hero h2 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.15; word-break: break-word; }
.hero .id { font-size: 12.5px; color: var(--muted); }
.hero a { color: var(--sky); text-decoration: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { padding: 9px 11px; border-radius: 12px; background: var(--ink); }
.stat span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 800; }
.stat b { display: block; font-size: 15.5px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.kv:first-child { border-top: 0; }
.kv span { color: var(--muted); }
.kv b { text-align: right; word-break: break-word; min-width: 0; }
details { border-radius: 12px; background: var(--ink); padding: 0 12px; }
details + details { margin-top: 6px; }
summary { list-style: none; padding: 11px 0; font-weight: 900; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "▾"; color: var(--muted); }
details[open] summary::after { content: "▴"; }
pre { margin: 0 0 12px; white-space: pre-wrap; word-break: break-all; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #D9CCF2; max-height: 340px; overflow: auto; }

/* почта */
.mail { display: flex; gap: 10px; align-items: flex-start; }
.mail .ic { flex: 0 0 40px; width: 40px; height: 40px; }
.mail .t { flex: 1; min-width: 0; }
.mail .t b { display: block; font-weight: 900; }
.mail .t p { margin: 3px 0 6px; color: var(--muted); font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.preview { margin-top: 10px; padding: 12px; border-radius: 14px; border: 2px dashed var(--line); }
.preview b { color: var(--gold2); }

/* журнал */
.log { padding: 9px 2px; border-top: 1px solid var(--line); font-size: 13.5px; }
.log:first-child { border-top: 0; }
.log b { font-weight: 900; }
.log small { display: block; color: var(--dim); font-size: 12px; }
.log code { color: var(--muted); font-size: 12px; word-break: break-all; }

/* нижнее меню */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 10px calc(var(--safe-bottom) + 8px); background: linear-gradient(rgba(27,16,48,0), var(--bg) 35%); }
.nav-in { display: flex; gap: 4px; max-width: 520px; margin: 0 auto; padding: 5px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 900; }
.nav button img { width: 30px; height: 30px; transition: transform .2s; }
.nav button.on { background: var(--card2); color: var(--gold2); }
.nav button.on img { transform: translateY(-2px) scale(1.1); }

/* состояния */
.state { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 30px 20px; }
.state img { width: 96px; height: 96px; margin: 0 auto 10px; }
.state h2 { margin: 0 0 8px; font-size: 22px; font-weight: 900; }
.state p { color: var(--muted); margin: 0 auto 14px; max-width: 320px; }
.state code { display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--card); color: var(--gold2); font-size: 15px; }
.skel { height: 64px; border-radius: 14px; background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.2s infinite; }
.skel + .skel { margin-top: 6px; }
@keyframes sk { to { background-position: -200% 0; } }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }

/* тост и подтверждение */
.toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 12px); z-index: 90; transform: translate(-50%, -150%); max-width: calc(100% - 28px); padding: 11px 16px; border-radius: 14px; border: 2px solid var(--ink); background: var(--gold); color: var(--ink); font-weight: 900; box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: transform .25s; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); }
.toast.err { background: var(--rose); }
.dlg { position: fixed; inset: 0; z-index: 80; display: grid; place-items: end center; padding: 14px 14px calc(var(--safe-bottom) + 14px); background: rgba(10,4,20,.7); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dlg-box { width: 100%; max-width: 440px; padding: 18px 16px 16px; border-radius: 22px; background: var(--bg2); border: 2px solid var(--line); animation: up .2s ease-out; }
.dlg-box h3 { margin: 0 0 6px; font-size: 19px; font-weight: 900; }
.dlg-box p { margin: 0 0 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
